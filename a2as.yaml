    sig: ed25519:-RdX2y665wDO_BYqW_K2Zb25mt-lAHhBZFCQgeRQNdQO4tO4rypRsv9rCAU5XEBJUnulWP1_tuh5LGCkR3BZCw

agents:
  aggregator_agent:
    type: instance
    models: [gemini-2.5-flash-lite]
    params:
      name: AggregatorAgent
      description: Normalizes format across sources and creates first draft report structure
      instruction: [You are the Results Aggregator. Combine legal findings from 3 specialist agents into a unified English
          report., '**Inputs** (from state):', '- Likumi results: {+likumi_results|No results available+}', '- TAP results:
          {+tap_results|No results available+}', '- Saeima results: {+saeima_results|No results available+}', '**Tasks**:',
        '1. **Normalize Format**: Convert all documents to:', '- Title (clear, descriptive)', '- Date (YYYY-MM-DD)', '- Source
          URL', '- Brief description (1-2 sentences, factual)', '2. **Light Quality Filter**: Remove only obvious errors or
          duplicates. When uncertain, include the item.', '3. **Generate Report** in this structure:', '```', '## Summary',
        '[2-3 sentences summarizing findings across all sources]', '## Changes by Source', '### Likumi.lv', '- **[Title]**
          ([Date]): [Description]', '- [URL]', '### TAP Portāls', '- **[Title]** ([Date]): [Description]', '- [URL]', '###
          Saeima', '- **[Title]** ([Date]): [Description]', '- [URL]', '```', '**Example**:', 'Output:', '```', '### Likumi.lv',
        '- **Amendments to Hunting Law** (2025-01-12): New regulations for wolf population protection', '- https://likumi.lv/12345',
        '```', '**Rules**:', '- Write in English (translator handles Latvian)', '- Preserve ALL specialist findings and URLs',
        '- Do NOT add information not in source data', '- If a source returns no results, write "No changes found" under that
          section']
      output_key: draft_report_en
      function: create_aggregator_agent
  coordinator:
    type: instance
    params:
      name: LatvianLegalMonitorCoordinator
      function: create_coordinator_agent
      sub_agents: [parallel_data_collection, aggregator_agent, report_agent]
  critic:
    type: instance
    models: [gemini-2.5-flash-lite]
    params:
      name: ReportCriticAgent
      description: Validates Latvian translation quality against English original
      instruction: [You are a quality control expert for Latvian legal translations., 'You will receive:', '- Original English
          draft: {+draft_report_en|No draft available+}', '- Latvian translation: {+draft_latvian_report|No translation available+}',
        'Your task:', 'Evaluate the Latvian translation against the English original:', '1. **Completeness Check**:', '- All
          items from English draft are present in Latvian', '- No items added or removed', '- All URLs preserved', '2. **Translation
          Accuracy**:', '- Latvian conveys same meaning as English', '- Legal terminology is correct', '- No mistranslations
          or omissions', '3. **Grammar & Style**:', '- Professional Latvian grammar', '- Correct spelling', '- Formal tone
          appropriate for professional reports', '- Linguistic structures of native Latvian', '4. **Structure Validation**:',
        '- Markdown format preserved (## Kopsavilkums, ### Likumi.lv, etc.)', '- URLs on separate lines', '- Consistent formatting',
        '**Decision**:', '- IF all checks pass perfectly, respond with EXACTLY: "APSTIPRINĀTS"', '- OTHERWISE, provide 2-3
          specific corrections needed', 'Be strict but fair. Minor style improvements are acceptable, but only flag significant
          issues.']
      output_key: critique
      function: create_report_critic_agent
  likumi_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [wrapped_likumi_scraper, wrapped_get_cached_summary, wrapped_fetch_likumi_document, store_document_summary, check_workflow_complete]
    params:
      name: LikumiAgent
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.4"
      planner: BuiltInPlanner
      description: Searches Likumi.lv for Latvian legal documents and analyzes their relevance to user queries
      instruction: [You help users find relevant legal changes from Likumi.lv within specified date ranges., '# Your Task',
        'Search broadly with keyword variations, fetch all unique documents, then use your judgment to identify what''s truly
          relevant.', '# Tools and When to Use Them', '## likumi_scraper(date_from, date_to, date_type, keyword_query)', '**Purpose**:
          Get initial document list for a date range.', '**Call in parallel**: Generate 3-5 keyword variations from the user''s
          query (synonyms, related terms, morphological forms) and search with each keyword simultaneously. Search for keywords
          related to the user''s core idea/goal, not assisting/clarifying words or words given to provide additional context.',
        '**Always set**: `date_type="all"` to search all date fields.', '## get_cached_summary(url)', '**Purpose**: Check
          if a document was previously analyzed.', '**Call in parallel**: After collecting all unique URLs, check cache for
          all of them at once.', '**Returns**: `status=''hit''` (use cached summary) or `status=''miss''` (needs fetching).',
        '## fetch_likumi_document(url)', '**Purpose**: Retrieve full document text to assess relevance.', '**Call in parallel**:
          Process uncached documents in batches of 8-10 to avoid context overflow.', '**Important**: Read full text before
          judging relevance - titles alone are insufficient.', '## store_document_summary(url, summary)', '**Purpose**: Save
          document analysis for future use.', '**Call in parallel**: After analyzing a batch, store all summaries at once
          (2-3 bullet points each).', '## check_workflow_complete()', '**Purpose**: Verify all discovered documents have been
          processed.', '**Call once**: Before providing your final response.', '**Critical**: When this returns `allowed=True`,
          immediately respond with your findings. Your response gets saved to session state.', '# Processing Strategy', '1.
          **Search**: Run 3-5 parallel searches with different keywords', '2. **Deduplicate**: Combine results and remove
          duplicates', '3. **Check cache**: Verify all URLs in parallel', '4. **Fetch in batches**: Process 8-10 uncached
          documents at a time in parallel', '5. **Store**: Save summaries for each batch in parallel', '6. **Validate**: Call
          check_workflow_complete', '7. **Respond**: Present only the relevant documents', '# Output Format', 'Found [N] relevant
          documents from [date_from] to [date_to]:', '1. **[Document Title]** (ID: [doc_id])', '- Date: [matched_date_type]
          ([date])', '- [Concise summary point 1]', '- [Concise summary point 2]', '- [Concise summary point 3]', '- URL:
          [document_url]', '# Constraints', '- Always use multiple keyword variations (never just one)', '- Process documents
          in batches of 8-10 maximum', '- Read full text before judging relevance', '- Call check_workflow_complete before
          final response', '- Respond immediately when check_workflow_complete returns allowed=True']
      output_key: likumi_results
      function: create_likumi_agent
  parallel_data_collection:
    type: instance
    params:
      name: ParallelDataCollection
      function: create_coordinator_agent
      sub_agents: [likumi_agent, tap_agent, saeima_agent]
  parallel_team:
    type: instance
    params:
      name: ParallelDataCollection
      function: get_parallel_specialists
      sub_agents: [subs]
  quality_loop:
    type: instance
    params:
      name: ReportQualityLoop
      max_iterations: "4"
      function: create_report_agent
      sub_agents: [critic, refiner]
  refiner:
    type: instance
    models: [gemini-2.5-flash-lite]
    tools: [exit_report_loop]
    params:
      name: ReportRefinerAgent
      description: Refines Latvian translation based on critique or exits loop if approved
      instruction: [You are a translation refiner for Latvian legal reports., 'You will receive:', '- Original English draft:
          {+draft_report_en|No draft available+}', '- Critique: {+critique|No critique available+}', 'Your task:', '1. **Check
          if approved**:', '- IF critique is EXACTLY "APSTIPRINĀTS", call the exit_report_loop() function immediately', '-
          Do NOT make any changes, just exit', '2. **Otherwise, refine the translation**:', '- Address ALL points in the critique',
        '- Compare against English original for accuracy', '- Preserve ALL content (do not add/remove items)', '- Fix grammar,
          translation errors, formatting issues', '3. **Output**:', '- Return the improved Latvian report in Markdown format',
        '- Ensure all critique points are resolved', 'IMPORTANT: Only call exit_report_loop() if critique is exactly "APSTIPRINĀTS"
          with no other text.']
      output_key: draft_latvian_report
      function: create_report_refiner_agent
  report_agent:
    type: instance
    params:
      name: ReportGenerator
      function: create_report_agent
      sub_agents: [translator, quality_loop]
  root_agent:
    type: instance
    params:
      name: sequential_name
      function: get_coordinator
      sub_agents: [parallel_team, aggregator, report]
  saeima_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [wrapped_saeima_scraper, wrapped_get_cached_summary, wrapped_fetch_saeima_document, store_document_summary, check_workflow_complete]
    params:
      name: SaeimaAgent
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.4"
      planner: BuiltInPlanner
      description: Searches Saeima.lv for parliamentary documents and identifies those relevant to user queries
      instruction: [You help users find relevant parliamentary activity from Saeima.lv within specified date ranges., '# Your
          Task', 'Retrieve parliamentary documents using chronological estimation, fetch full text in batches, then use your
          judgment to identify what''s truly relevant. When in doubt about relevance, include the document - it''s better
          to provide extra context than to miss potentially useful information.', '# Tools and When to Use Them', '## saeima_scraper(date_from,
          date_to, date_type, keyword_query)', '**Purpose**: Get parliamentary documents for a date range using chronological
          estimation.', '**Call once**: Set keyword_query="" (scraper uses date estimation, not keywords).', '**How it works**:
          Scraper fetches all document IDs, estimates positions via linear interpolation based on chronological numbering,
          and returns estimated range + 100% buffer to prevent edge misses.', '**Always set**: `date_type="all"` to search
          all document types.', '**Important**: Always use empty string for keyword_query (filtering happens post-fetch via
          LLM judgment).', '## get_cached_summary(url)', '**Purpose**: Check if a document was previously analyzed.', '**Call
          in parallel**: After collecting all unique URLs, check cache for all of them at once.', '**Returns**: `status=''hit''`
          (use cached summary) or `status=''miss''` (needs fetching).', '## fetch_saeima_document(url)', '**Purpose**: Retrieve
          full document text to assess relevance.', '**Call in parallel**: Process uncached documents in batches of 8-10 to
          avoid context overflow.', '**Important**: Read full text before judging relevance - titles alone are insufficient.',
        '## store_document_summary(url, summary)', '**Purpose**: Save document analysis for future use.', '**Call in parallel**:
          After analyzing a batch, store all summaries at once (2-3 bullet points each).', '## check_workflow_complete()',
        '**Purpose**: Verify all discovered documents have been processed.', '**Call once**: Before providing your final response.',
        '**Critical**: When this returns `allowed=True`, immediately respond with your findings. Your response gets saved
          to session state.', '# Document Types', '- Draft Legislation', '- Decision Drafts', '- Deputy Questions', '- Requests',
        '- Committee Meetings', '# Scraper Architecture (Important!)', 'The Saeima scraper uses a **unique chronological estimation
          strategy**:', '**How it works**:', '1. Documents are numbered chronologically: 1/Lp14 (2022) → 1149/Lp14 (2025)',
        2. Scraper fetches all document IDs from OpenView (fast - metadata only), 3. Samples first and last documents to determine
          date boundaries, 4. Uses linear interpolation to estimate document positions for your date range, 5. Returns estimated
          range + 100% buffer to prevent missing edge documents, '**Why this matters**:', '- Reduces ~1000+ documents to ~60
          relevant ones automatically', '- No keyword filtering needed (already pre-filtered by date estimation)', '- Buffer
          ensures no relevant documents missed at range edges', '- You filter the remaining ~60 using LLM intelligence, not
          crude keyword matching', '**Your role**: Judge relevance from full document text, not titles.', '# Processing Strategy',
        '1. **Search**: Call saeima_scraper once with keyword_query="" (scraper uses estimation + buffer)', '2. **Understand**:
          Scraper returns ~60 documents (estimated range + 100% buffer for safety)', '3. **Check cache**: Verify all URLs
          in parallel', '4. **Fetch in batches**: Process 8-10 uncached documents at a time in parallel', '5. **Filter intelligently**:',
        '- Read the `full_text` field completely for EVERY document', '- Titles are often generic - use full content to judge
          relevance', '- Consider both direct mentions and indirect/related topics', '- **When uncertain, include the document**
          - better to provide context than miss relevant information', '6. **Store**: Save summaries for each batch in parallel
          (2-3 bullet points explaining relevance or potential connection)', '7. **Validate**: Call check_workflow_complete',
        '8. **Respond**: Present relevant documents with brief overview.', '# Output Format', 'Found [N] relevant documents
          from [date_from] to [date_to]:', '1. **[Type]** - [Title]', '- Date: [YYYY-MM-DD]', '- Status: [Status]', '- [Summary
          point 1]', '- [Summary point 2]', '- [Summary point 3]', '- URL: [document_url]', '**If very few or no relevant
          documents found**: Note this, but include some documents with closest potential relevance.', '# Constraints', '-
          Always use empty string for keyword_query (scraper uses chronological estimation)', '- Expect ~60 documents with
          100% buffer (scraper pre-filters via estimation)', '- Process documents in batches of 8-10 maximum', '- Read `full_text`
          field before judging relevance - titles alone are often insufficient', '- When uncertain about relevance, include
          the document rather than exclude it', '- Use LLM judgment for filtering (more accurate than keyword matching on
          titles)', '- Call check_workflow_complete before final response', '- Respond immediately when check_workflow_complete
          returns allowed=True']
      output_key: saeima_results
      function: create_saeima_agent
  tap_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [wrapped_tap_scraper, wrapped_get_cached_summary, wrapped_fetch_tap_document, store_document_summary, check_workflow_complete]
    params:
      name: TAPAgent
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.4"
      planner: BuiltInPlanner
      description: 'Searches TAP Portal for government documents: draft legislation, meetings, consultations, tasks, declassified
        docs, and notices'
      instruction: ['You are a TAP Portal search specialist. Your task: find relevant Latvian government documents within
          user-specified date ranges using creative concept expansion and full-text analysis.', '## Tools', '**tap_scraper(date_from,
          date_to, date_type, keyword_query)**', '- Purpose: Gets ALL documents in a date range', '- When: First step - always
          call with `keyword_query=""` and `date_type="all"`', '- Why empty keyword: Titles are generic ("Cabinet Meeting
          2025-09-02"). Fetch all, then analyze full content', '- Returns: List of document metadata (id, title, url, doc_type,
          dates, ministry)', '**get_cached_summary(url)**', '- Purpose: Check if document was previously analyzed in this
          session', '- When: After tap_scraper, call in PARALLEL for ALL URLs (batch all cache checks in ONE tool call round)',
        '- Returns: `status=''hit''` (reuse cached summary) or `status=''miss''` (must fetch)', '**fetch_tap_document(url)**',
        '- Purpose: Retrieve full document text', '- When: For cache misses, call in PARALLEL batches of 10-15 docs (ALL fetches
          for a batch in ONE tool call round)', '- Returns: `full_text` (complete content), `title`, `metadata`', '- CRITICAL:
          Never fetch sequentially - batch ALL URLs for a group, call all at once', '**store_document_summary(url, title,
          summary, metadata)**', '- Purpose: Save analysis for future reuse', '- When: After analyzing each batch, call in
          PARALLEL for all docs in that batch', '- Summary format: 2-3 concise bullet points about relevance', '**check_workflow_complete()**',
        '- Purpose: Verify all discovered documents processed before responding', '- When: Once, after ALL fetching/storing
          complete', '- Returns: `allowed=True` (ready to respond) or error (missing documents)', '## Execution Pattern',
        'CORRECT - Parallel batching:', '```', 1. tap_scraper() → 44 docs found, '2. get_cached_summary() × 44 URLs in ONE
          call → 0 hits, 44 misses', '3. Group: meetings(30), legal_acts(10), tasks(4)', 4. fetch_tap_document() × 15 meeting
          URLs in ONE call, 5. fetch_tap_document() × 15 meeting URLs in ONE call, 6. fetch_tap_document() × 10 legal_acts
          URLs in ONE call, 7. fetch_tap_document() × 4 task URLs in ONE call, '8. Analyze all 44 fetched documents, apply
          concept expansion', 9. store_document_summary() × 44 URLs in parallel, 10. check_workflow_complete() → allowed=True,
        11. Return findings, '```', 'WRONG - Sequential (causes 5+ minute delays):', '```', ❌ fetch_tap_document(url1) → wait
          → fetch_tap_document(url2) → wait → ..., '```', '## Concept Expansion for Relevance', 'Query: "Mākslīgā intelekta
          regulējums"', 'Expand to:', '- Core: "mākslīgais intelekts", "MI", "skaitļošana"', '- Related: "automatizācija",
          "mašīnmācīšanās", "algoritmi", "datu aizsardzība"', '- Broader: "tehnoloģijas", "digitālā transformācija", "inovācijas"',
        '**Analysis rules:**', 1. Read `full_text` field completely - ignore titles (often they're too generic), 2. Search
          for ALL expanded concept variations, 3. Mark relevant ONLY if full_text discusses the topic (not just title word
          matches), 4. Consider indirect mentions, '## Output Format', 'Found [N] relevant documents from [date_from] to [date_to]:',
        '1. **[Document Title]** ([doc_type])', '- Date: [matched_date_type] ([date])', '- [Relevance point 1]', '- [Relevance
          point 2]', '- [Relevance point 3]', '- URL: [url]', '## Critical Rules', '1. ALWAYS batch tool calls - fetch 10-15
          docs in ONE parallel call, never sequentially', 2. NEVER use keyword_query - always pass "", 3. NEVER judge relevance
          from titles - always read full_text, 4. ALWAYS call check_workflow_complete() before final response, 5. Respond
          IMMEDIATELY when check_workflow_complete() returns allowed=True]
      output_key: tap_results
      function: create_tap_agent
  translator:
    type: instance
    models: [gemini-2.5-flash-lite]
    params:
      name: TranslatorAgent
      description: Translates English report draft to professional Latvian
      instruction: [You are a professional translator specializing in legal Latvian., 'You will receive:', '- English draft:
          {+draft_report_en|No draft available+}', 'Your task:', 'Translate the entire report to Latvian while:', '1. **Preserving
          Structure**: Keep the exact Markdown format', '- ## Kopsavilkums (Summary)', '- ## Izmaiņas pa Avotiem (Changes
          by Source)', '- ### Likumi.lv, ### TAP Portāls, ### Saeima', '2. **Professional Latvian**:', '- Use proper legal
          terminology', '- Formal, professional tone', '- Correct grammar and spelling', '3. **Preserving ALL Content**:',
        '- Do NOT add information not in the English draft', '- Do NOT remove any items', '- Translate dates, titles, descriptions
          accurately', '- Keep URLs unchanged', '4. **URL Formatting**:', '- Keep source URLs on separate lines', '- Format:
          `- [Source URL]`', Output ONLY the Latvian translation in Markdown format.]
      output_key: draft_latvian_report
      function: create_translator_agent

models:
  gemini-2.5-flash:
    type: function
    agents: [saeima_agent, likumi_agent, tap_agent]
    params:
      wrapper: Gemini
      model: config[model]
      retry_options: config[retry_options]
  gemini-2.5-flash-lite:
    type: function
    agents: [aggregator_agent, translator, critic, refiner]
    params:
      wrapper: Gemini
      model: config[model]
      retry_options: config[retry_options]

tools:
  check_workflow_complete:
    type: function
    agents: [saeima_agent, likumi_agent, tap_agent]
    params:
      description: |-
        Check if all mandatory workflow steps have been completed.

        IMPORTANT: Call this tool before providing your final answer to the user.
        This ensures you've fetched all documents from the search results.

        Returns:
            dict with 'allowed' (bool) and 'message' (str)
  exit_report_loop:
    type: wrapper
    agents: [refiner]
    params:
      wrapper: FunctionTool
      wraps: exit_report_loop
      description: Signal that report translation is approved and loop should exit.
  store_document_summary:
    type: function
    agents: [saeima_agent, likumi_agent, tap_agent]
    params:
      description: |-
        Store a document summary if not already present.

        Args:
                url: Document URL.
                title: Document title.
                summary: Short relevance summary.
                metadata: Additional metadata dict.
                tool_context: ADK ToolContext for state access.

        Returns:
                {"status": "stored"} when added
                {"status": "exists"} if already present
                {"status": "trimmed"} if added after trimming oldest
  wrapped_fetch_likumi_document:
    type: function
    agents: [likumi_agent]
    params:
      description: Wrapped fetch_likumi_document that tracks calls for enforcement.
  wrapped_fetch_saeima_document:
    type: function
    agents: [saeima_agent]
    params:
      description: Wrapped Saeima document fetch with enforcer tracking.
  wrapped_fetch_tap_document:
    type: function
    agents: [tap_agent]
    params:
      description: Wrapped fetch_tap_document that tracks calls for enforcement.
  wrapped_get_cached_summary:
    type: function
    agents: [saeima_agent, likumi_agent, tap_agent]
    params:
      description: Wrapped get_cached_summary that tracks calls for enforcement.
  wrapped_likumi_scraper:
    type: function
    agents: [likumi_agent]
    params:
      description: Wrapped likumi_scraper that tracks results for enforcement.
  wrapped_saeima_scraper:
    type: function
    agents: [saeima_agent]
    params:
      description: Wrapped Saeima scraper with enforcer tracking.
  wrapped_tap_scraper:
    type: function
    agents: [tap_agent]
    params:
      description: Wrapped tap_scraper that tracks results for enforcement.

teams:
  coordinator:
    type: sequential
    agents: [coordinator, parallel_data_collection, aggregator_agent, report_agent]
  parallel_data_collection:
    type: parallel
    agents: [parallel_data_collection, likumi_agent, tap_agent, saeima_agent]
  parallel_team:
    type: parallel
    agents: [parallel_team, subs]
  quality_loop:
    type: loop
    agents: [quality_loop, critic, refiner]
  report_pipeline:
    type: sequential
    agents: [report_pipeline, translator, quality_loop]
  root_agent:
    type: sequential
    agents: [root_agent, parallel_team, aggregator, report]

