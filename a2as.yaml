    type: shell
    actions: [exec]
    args: [[-m, playwright, install, chromium]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
      ref: sys.executable

networks:
  tapportals.mk.gov.lv:
    type: api
    actions: [GET]
    urls: ['/legal_acts?page=1', '/public_participation?page=1', '/tasks?page=1', '/declassified_documents?page=1', '/informative_notices?page=1',
      /informative_notices/None]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [_scrape_legal_acts, _scrape_meetings, _scrape_public_participation, _scrape_tasks, _scrape_declassified_documents,
        _scrape_informative_notices, _fetch_all_document_ids, _fetch_document_date]
  tapportals.mk.gov.lv.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://tapportals.mk.gov.lv/legal_acts/{project_id}
      caller: [_parse_legal_act_item]
  tapportals.mk.gov.lv.2:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://tapportals.mk.gov.lv/meetings/{meeting_type}
      caller: [_scrape_meetings]
  tapportals.mk.gov.lv.3:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
