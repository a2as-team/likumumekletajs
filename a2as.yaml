    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://tapportals.mk.gov.lv/tasks/{task_num}
      caller: [_parse_task_item]
  tapportals.mk.gov.lv.7:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://tapportals.mk.gov.lv/declassified_documents/{project_id}
      caller: [_parse_declassified_item]
  tapportals.mk.gov.lv.8:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
